<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezeptshop Admin — Produkte</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Rezeptshop <span class="admin-badge">Admin</span></h1>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="produkte.html">Produkte</a>
      <a href="benutzer.html">Benutzer</a>
      <span id="nav-session"></span>
    </nav>
  </header>

  <main>
    <section>
      <h2 id="form-title">Neues Produkt</h2>
      <form id="product-form" class="admin-form">
        <input type="hidden" id="product-id">
        <div class="form-grid">
          <div class="form-group">
            <label for="p-name">Name *</label>
            <input type="text" id="p-name" required>
          </div>
          <div class="form-group">
            <label for="p-category">Kategorie</label>
            <input type="text" id="p-category">
          </div>
          <div class="form-group">
            <label for="p-price">Preis (€) *</label>
            <input type="number" id="p-price" step="0.01" min="0" required>
          </div>
          <div class="form-group">
            <label for="p-amount">Bestand *</label>
            <input type="number" id="p-amount" step="1" min="0" required>
          </div>
          <div class="form-group full">
            <label for="p-description">Beschreibung</label>
            <input type="text" id="p-description">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn" id="submit-btn">Anlegen</button>
          <button type="button" class="btn accent hidden" id="cancel-btn">Abbrechen</button>
        </div>
      </form>
      <div id="form-msg"></div>
    </section>

    <section>
      <h2>Alle Produkte</h2>
      <div id="table-container">
        <p>Produkte werden geladen …</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Rezeptshop — Administration</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/produkte.js"></script>
</body>
</html>
