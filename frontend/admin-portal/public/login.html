<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezeptshop Admin — Anmelden</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Rezeptshop <span class="admin-badge">Admin</span></h1>
    <nav></nav>
  </header>

  <main>
    <div class="auth-card">
      <h2>Admin-Anmeldung</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">E-Mail</label>
          <input type="email" id="login-email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Passwort</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn full">Anmelden</button>
      </form>
      <p class="hint">Nur für Administratoren. Endkunden nutzen das Shop-Portal.</p>
      <div id="login-msg"></div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Rezeptshop — Administration</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
