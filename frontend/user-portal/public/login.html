<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezeptshop — Anmelden</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1><a href="index.html">Rezeptshop</a></h1>
    <nav>
      <a href="index.html">Produkte</a>
      <span id="nav-session"></span>
    </nav>
  </header>

  <main>
    <div class="auth-card">
      <div class="tabs">
        <button type="button" class="active" data-tab="login">Login</button>
        <button type="button" data-tab="register">Registrieren</button>
        <button type="button" data-tab="magic">Magic-Link</button>
      </div>

      <!-- Tab: Login -->
      <section id="tab-login">
        <h2>Anmelden</h2>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">E-Mail</label>
            <input type="email" id="login-email" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="login-password">Passwort</label>
            <input type="password" id="login-password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn full">Anmelden</button>
        </form>
        <div id="login-msg"></div>
      </section>

      <!-- Tab: Registrieren -->
      <section id="tab-register" class="hidden">
        <h2>Konto erstellen</h2>
        <form id="register-form">
          <div class="form-group">
            <label for="reg-email">E-Mail</label>
            <input type="email" id="reg-email" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="reg-password">Passwort</label>
            <input type="password" id="reg-password" required minlength="8" autocomplete="new-password">
            <p class="hint">Mindestens 8 Zeichen.</p>
          </div>
          <button type="submit" class="btn full">Registrieren</button>
        </form>
        <div id="register-msg"></div>
      </section>

      <!-- Tab: Magic-Link (Code-Variante) -->
      <section id="tab-magic" class="hidden">
        <h2>Login per Einmal-Code</h2>
        <p class="hint">
          Wir senden dir einen Einmal-Code per E-Mail. Gib ihn unten ein.
        </p>

        <form id="magic-request-form">
          <div class="form-group">
            <label for="magic-email">E-Mail</label>
            <input type="email" id="magic-email" required autocomplete="email">
          </div>
          <button type="submit" class="btn full accent">Code anfordern</button>
        </form>

        <form id="magic-login-form" style="margin-top:1rem;">
          <div class="form-group">
            <label for="magic-code">Einmal-Code</label>
            <input type="text" id="magic-code" placeholder="Code aus der Mail">
          </div>
          <button type="submit" class="btn full">Einloggen</button>
        </form>
        <div id="magic-msg"></div>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Rezeptshop</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
